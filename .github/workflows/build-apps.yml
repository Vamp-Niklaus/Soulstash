name: Build Android and Windows apps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    name: Check version update
    runs-on: ubuntu-latest
    # Skip checking if it's a pull request (PRs don't publish releases)
    if: github.event_name != 'pull_request'
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check if version needs release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "Package version: $VERSION ($TAG)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual workflow trigger - proceeding with build"
            echo "should_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists on GitHub. Skipping build."
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "Release $TAG does not exist. Proceeding with build and release!"
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

  windows:
    name: Windows installer
    runs-on: windows-latest
    needs: check-version
    if: github.event_name != 'pull_request' && needs.check-version.outputs.should_build == 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install NSIS
        run: choco install nsis --yes --no-progress

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Sync Tauri version from package.json
        shell: pwsh
        run: |
          $version = "${{ needs.check-version.outputs.version }}"
          $confPath = "src-tauri/tauri.conf.json"
          $conf = Get-Content $confPath -Raw | ConvertFrom-Json
          $conf.version = $version
          $conf | ConvertTo-Json -Depth 10 | Set-Content $confPath -Encoding utf8

      - name: Build Windows installer (signed for in-app updates)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run desktop:build

      - name: Create latest.json for the in-app updater
        shell: pwsh
        run: |
          $dir = "src-tauri/target/release/bundle/nsis"
          $exe = Get-ChildItem "$dir/*.exe" | Select-Object -First 1
          $sig = Get-Content "$($exe.FullName).sig" -Raw
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $url = "https://github.com/Vamp-Niklaus/Soulstash/releases/latest/download/$([uri]::EscapeDataString($exe.Name))"
          $json = [ordered]@{
            version  = $version
            notes    = "Soulstash $version"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{ signature = $sig.Trim(); url = $url }
            }
          }
          $json | ConvertTo-Json -Depth 5 | Set-Content "$dir/latest.json" -Encoding utf8

      - name: Upload Windows installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/nsis/latest.json
          if-no-files-found: error
          retention-days: 7

  android:
    name: Signed Android APK
    runs-on: ubuntu-latest
    needs: check-version
    if: github.event_name != 'pull_request' && needs.check-version.outputs.should_build == 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: ${name}"
              exit 1
            fi
          done

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Sync Android versionName from package.json
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          sed -i "s/versionName \"[^\"]*\"/versionName \"${VERSION}\"/" android/app/build.gradle

      - name: Build web assets and sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/soulstash-release.keystore"

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/soulstash-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rename and Stage APK
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          mkdir -p android-staging
          cp android/app/build/outputs/apk/release/app-release.apk "android-staging/Soulstash-v${VERSION}.apk"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: android-staging/*.apk
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [check-version, windows, android]
    if: always() && needs.check-version.outputs.should_build == 'true' && (needs.windows.result == 'success' || needs.android.result == 'success')
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        if: needs.windows.result == 'success'
        with:
          name: windows-artifacts
          path: dist-release

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        if: needs.android.result == 'success'
        with:
          name: android-artifacts
          path: dist-release

      - name: Publish Release to GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          TAG="v$VERSION"
          echo "Release assets staged in dist-release:"
          ls -la dist-release/

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Uploading assets to existing release $TAG..."
            gh release upload "$TAG" dist-release/* --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" dist-release/* \
              --title "Soulstash $TAG" \
              --generate-notes
          fi
